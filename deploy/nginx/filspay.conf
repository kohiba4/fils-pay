# FilsPay front door. Same-origin by design: the API has no CORS, so the web app and the admin console are served from
# the same origin as the API they call (/v1/ is proxied), which also keeps the session cookies first-party.
#   https://@PUBLIC_HOST@        merchant dashboard + checkout (/pay/<token>) + public API (/v1/)
#   https://@PUBLIC_HOST@:8443   admin console + its API (/v1/)
#
# OVERLOAD POLICY (capacity criterion): excess load is turned away early and cheaply with 503 instead of queueing until the
# API (512 MB, 0.5 vCPU) falls over, and it is turned away at the START of a checkout, never in the middle of one:
#   * NEW work (POST /v1/transactions = authorize, POST /v1/payment-links/<token>/pay) is limited to __NEWCONN__ in-flight
#     requests and __GLOBAL_RATE__ requests/s in total (the measured capacity, see docs/audit/LOAD-TEST.md);
#   * work that COMPLETES an already-admitted checkout (capture, void, refund, reads, the admin plane) is never rejected by
#     those limits, only by a high total ceiling of __MAXCONN__ in-flight requests that protects memory.
# Otherwise a capture could be rejected after its authorization was accepted, which wastes the work already done and leaves
# authorizations hanging. There is deliberately no per-IP limit: a load generator (or an office behind one NAT address)
# comes from one IP and must be limited by the server's real capacity, not by an arbitrary per-client number.
# A request whose key below is empty is not counted by nginx's limit modules.
map "$request_method:$uri" $new_work_key {
    default "";
    "POST:/v1/transactions" "new";
    "~^POST:/v1/payment-links/[^/]+/pay$" "new";
}
limit_req_zone  $new_work_key zone=newrate:1m rate=__GLOBAL_RATE__r/s;
limit_conn_zone $new_work_key zone=connnew:1m;
limit_conn_zone $server_name  zone=connglobal:1m;
limit_req_status 503;
limit_conn_status 503;

upstream filspay_api {
    server 127.0.0.1:3000 max_fails=0;
    keepalive 32;
}

server {
    listen 80;
    server_name @PUBLIC_HOST@;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}


server {
    listen 443 ssl http2;
    server_name @PUBLIC_HOST@;
    ssl_certificate     /etc/letsencrypt/live/@PUBLIC_HOST@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@PUBLIC_HOST@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    server_tokens off;
    client_max_body_size 10m;

    root /var/www/filspay-web;

    location /v1/ {
        limit_req zone=newrate burst=__BURST__ nodelay;
        limit_conn connnew __NEWCONN__;
        limit_conn connglobal __MAXCONN__;
        proxy_pass http://filspay_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;   # never retry a POST on another attempt: money endpoints are not blindly repeatable
    }
    location = /healthz { proxy_pass http://filspay_api; proxy_http_version 1.1; proxy_set_header Connection ""; }
    location = /readyz  { proxy_pass http://filspay_api; proxy_http_version 1.1; proxy_set_header Connection ""; }

    location / { try_files $uri /index.html; }
}

server {
    listen 8443 ssl http2;
    server_name @PUBLIC_HOST@;
    ssl_certificate     /etc/letsencrypt/live/@PUBLIC_HOST@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@PUBLIC_HOST@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    server_tokens off;
    client_max_body_size 10m;

    root /var/www/filspay-admin;

    location /v1/ {
        proxy_pass http://filspay_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
    }
    location / { try_files $uri /index.html; }
}
