# FilsPay front door. Same-origin by design: the API has no CORS, so the web app and the admin console are served from
# the same origin as the API they call (/v1/ is proxied), which also keeps the session cookies first-party.
#   https://@PUBLIC_HOST@        merchant dashboard + checkout (/pay/<token>) + public API (/v1/)
#   https://@PUBLIC_HOST@:8443   admin console + its API (/v1/)
#
# OVERLOAD POLICY (capacity criterion): excess load is turned away early and cheaply with 503/429 instead of queueing
# until the API (512 MB, 0.5 vCPU) falls over. The global rate is a ceiling just above the measured capacity (tuned from
# the load test in docs/audit/LOAD-TEST.md); the per-IP limit stops one client from taking all of it.
limit_req_zone $binary_remote_addr zone=perip:10m rate=40r/s;
limit_req_zone $server_name        zone=global:1m  rate=120r/s;
limit_conn_zone $binary_remote_addr zone=connperip:10m;
limit_req_status 503;
limit_conn_status 503;

upstream filspay_api {
    server 127.0.0.1:3000 max_fails=0;
    keepalive 32;
}

server {
    listen 80;
    server_name @PUBLIC_HOST@;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}


server {
    listen 443 ssl;
    http2 on;
    server_name @PUBLIC_HOST@;
    ssl_certificate     /etc/letsencrypt/live/@PUBLIC_HOST@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@PUBLIC_HOST@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    server_tokens off;
    client_max_body_size 10m;

    root /var/www/filspay-web;

    location /v1/ {
        limit_req zone=global burst=60 nodelay;
        limit_req zone=perip  burst=40 nodelay;
        limit_conn connperip 40;
        proxy_pass http://filspay_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;   # never retry a POST on another attempt: money endpoints are not blindly repeatable
    }
    location = /healthz { proxy_pass http://filspay_api; proxy_http_version 1.1; proxy_set_header Connection ""; }
    location = /readyz  { proxy_pass http://filspay_api; proxy_http_version 1.1; proxy_set_header Connection ""; }

    location / { try_files $uri /index.html; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name @PUBLIC_HOST@;
    ssl_certificate     /etc/letsencrypt/live/@PUBLIC_HOST@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@PUBLIC_HOST@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    server_tokens off;
    client_max_body_size 10m;

    root /var/www/filspay-admin;

    location /v1/ {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://filspay_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
    }
    location / { try_files $uri /index.html; }
}
